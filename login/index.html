<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Multiventas Rafa</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Iconos -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class=" bg-gray-100">
    <!-- ================= CONTENIDO ================= -->
    <div class="min-h-[calc(100vh-100px)]
            flex flex-col lg:flex-row">

        <!-- ================= PANEL IZQUIERDO ================= -->
        <section class="hidden md:flex h-full w-full lg:w-[50%]
                        bg-gradient-to-br
                        from-[#28675f]
                        to-[#397d74]
                        min-h-[500px] 
                        lg:min-h-[calc(100vh-0px)]
                        flex flex-col items-center justify-center
                        text-white px-8">

            <!-- IMAGEN -->
            <div class="mb-7">
   
                <img
                    src="../img/logo.png"
                    alt="logo"
                    class="w-[380px] md:w-[410px]
                        mx-auto
                        object-contain mb-5"
                >

            </div>


            <!-- TEXTO -->
            <p class="text-center
                    text-lg
                    md:text-4xl
                    font-semibold
                    max-w-[500px]
                    leading-relaxed">

                Tu mejor aliado en útiles escolares,
                aseo y desechables.

            </p>


            <!-- REDES SOCIALES -->
            <div class="flex gap-5 mt-8">

                <!-- FACEBOOK -->
                <a href="https://www.facebook.com/share/1DoAgb7uV8/"
                class="w-10 h-10
                        rounded-full
                        bg-black
                        flex items-center justify-center
                        hover:scale-110
                        transition">

                    <i class="fa-brands fa-facebook-f text-[#00a9e0]"></i>

                </a>


                <!-- INSTAGRAM -->
                <a href="https://www.instagram.com/leidy.quesada.877108/"
                class="w-10 h-10
                        rounded-full
                        bg-black
                        flex items-center justify-center
                        hover:scale-110
                        transition">

                    <i class="fa-brands fa-instagram text-[#00a9e0]"></i>

                </a>


                <!-- WEB -->
                <a href="https://www.figma.com/design/c281akrCvcFwhg4dXI3Z17/Dise%C3%B1o-del-proyecto?node-id=11-468&p=f&t=Y6cqxC4GlUJyJxZm-0"
                class="w-10 h-10
                        rounded-full
                        bg-black
                        flex items-center justify-center
                        hover:scale-110
                        transition">

                    <i class="fa-solid fa-globe text-[#00a9e0]"></i>

                </a>

            </div>

        </section>



        <!-- ================= PANEL DERECHO ================= -->
        <section class="relative w-full lg:w-[50%]
                        min-h-[800px]
                        overflow-hidden
                        bg-gradient-to-br
                        from-[#40565d]
                        via-[#627c82]
                        to-[#a2b8bc]
                        flex items-center justify-center">


            <!-- FIGURAS DECORATIVAS -->

            <div class="absolute
                        w-[8px] h-[210px]
                        bg-[#3b806f]
                        rounded-full
                        top-0 left-[25%]
                        rotate-[7deg]">
            </div>


            <div class="absolute
                        w-[90px] h-[8px]
                        bg-[#66bba5]
                        rounded-full
                        top-[12%] right-[10%]
                        rotate-[7deg]">
            </div>


            <div class="absolute
                        w-[8px] h-[190px]
                        bg-[#66bba5]
                        top-[14%] right-[10%]
                        rotate-[-28deg]">
            </div>


            <div class="absolute
                        w-[8px] h-[160px]
                        bg-[#66bba5]
                        top-[25%] right-[15%]
                        rotate-[-38deg]">
            </div>


            <div class="absolute
                        w-[120px] h-[8px]
                        bg-[#66bba5]
                        rounded-full
                        bottom-[15%] left-[15%]
                        rotate-[5deg]">
            </div>


            <div class="absolute
                        w-[8px] h-[140px]
                        bg-[#3d7468]
                        bottom-0 left-[22%]
                        rotate-[-2deg]">
            </div>



            <!-- ================= LOGIN ================= -->
            <div class=" relative z-10
                        
                        bg-white
                        rounded-2xl
                        shadow-2xl
                        px-6 py-7">

                <!-- TITULO -->
                <h1 class="text-center
                        text-[#34484d]
                        text-4xl
                        font-bold
                        mb-6">

                    LOGIN

                </h1>


                <!-- FORMULARIO -->
                <form class="space-y-5">

                    <!-- CORREO -->
                    <div>

                        <label
                            class="block
                                   text-gray-700
                                   mb-1">

                            Correo Electrónico

                        </label>

                        <input
                            type="email"
                            placeholder="ejemplo@correo.com"
                            class="w-full
                                   h-9
                                   border
                                   border-[#54b3a5]
                                   rounded-lg
                                   px-3
                                   text-xs
                                   outline-none
                                   focus:ring-2
                                   focus:ring-[#54b3a5]"
                        >

                    </div>


                    <!-- CONTRASEÑA -->
                    <div>

                        <label
                            class="block
                                   text-gray-700
                                   mb-1">

                            Contraseña

                        </label>

                        <input
                            type="password"
                            placeholder="••••••••"
                            class="w-full
                                   h-9
                                   border
                                   border-[#54b3a5]
                                   rounded-lg
                                   px-3
                                   text-xs
                                   outline-none
                                   focus:ring-2
                                   focus:ring-[#54b3a5]"
                        >

                    </div>


                    <!-- BOTON -->
                    <a href="../index.html">
                    <button
                        type="submit"
                        class="w-48 mx-auto
                               h-9
                               rounded-full
                               bg-gradient-to-r
                               from-[#80d0ce]
                               to-[#344d4e]
                               text-white
                               text-2xl
                               font-bold
                               hover:scale-[1.02]
                               transition 
                               flex items-center justify-center">

                        Iniciar Sesión
                    </a>
                    </button>
                    


                    <!-- OLVIDÓ CONTRASEÑA -->
                    <div class=" text-center ">

                        <a href=""
                           class="text-[#3fa38f]
                                  hover:underline">

                            ¿Olvidaste tu contraseña?

                        </a>

                    </div>


                    <!-- REGISTRO -->
                    <div class="text-center  text-gray-700">

                        ¿No tienes cuenta?

                        <a href="../register/index.html"
                           class="text-[#3fa38f]
                                font-semibold
                                hover:underline">

                            Regístrate

                        </a>
                         <a
                            href="../index.html"
                            class=" text-[#3fa38f]
                                font-semibold
                                hover:underline flex items-center justify-center">
                            volver a inicio
                        </a>

                        

                </form>

            </div>

        </section>

    </div>

</body>
</html>
